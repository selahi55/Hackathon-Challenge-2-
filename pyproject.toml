[project]
name = "hollandse-luchten-hotspots"
version = "0.1.0"
description = "Hollandse Luchten Challenge 2: screening local PM2.5 hotspots (notebooks and a Streamlit explorer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # data
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    # hotspot screening app (notebooks/04_hotspot_screening_app.ipynb)
    "streamlit>=1.67.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "matplotlib>=3.8",
    "folium>=1.0.0",
    "streamlit-folium>=0.27.4",
    # running the notebooks
    "jupyter",
]

[tool.uv]
package = false  # an application, not a library: uv only manages the environment
